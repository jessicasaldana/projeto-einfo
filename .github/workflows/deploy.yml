name: CI Docker

on:
    push:
        branches:
            - main
jobs:
    build:
        name: Build e Push GHCR
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Baixar código
              uses: action/checkout@v4

            - name: Login GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Build da imagem
              run: |
                docker build \
                -t ghcr.io/${{ github.repository_owner }} /projeto-einfo:v1


