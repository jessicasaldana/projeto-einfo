services:

  api:
    build: .
    container_name: projeto-api
    ports:
      - 3333:3333
    environment:
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/projeto

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: projeto-postgres
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 123456
        POSTGRES_DB: projeto
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
